name: Build and test

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WtTranslator.sln
      - name: Build
        run: dotnet build WtTranslator.sln -c Release --no-restore
      - name: Test
        run: dotnet test WtTranslator.sln -c Release --no-build
      - name: Version
        shell: bash
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/package-macos.sh '${{ matrix.rid }}' "$VERSION"
      - name: Publish Windows / Linux
        if: runner.os != 'macOS'
        shell: bash
        run: |
          dotnet publish src/WtTranslator.App -c Release -r '${{ matrix.rid }}' --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$VERSION" -o 'out/${{ matrix.rid }}'
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Remove-Item out/win-x64/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out/win-x64/* -DestinationPath "dist/WtTranslator-$env:VERSION-win-x64.zip"
      - name: Archive Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          rm -f out/linux-x64/*.pdb
          tar -czf "dist/WtTranslator-$VERSION-linux-x64.tar.gz" -C out/linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: WtTranslator-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "WT Translator Local $RELEASE_TAG" --generate-notes
